name: ttrack
arch: amd64
platform: linux
version: ${TTRACK_VERSION}
section: utils
priority: optional
maintainer: ttrack-tracker maintainers <noreply@example.com>
description: |
  Record and replay Linux terminal sessions.
  ttrack runs a shell under a PTY and captures its output as asciinema v2
  cast files. The ttrackd root daemon collects sessions from all users into
  a root-only central store (/var/lib/ttrack) for audit, with live tail.
vendor: ttrack-tracker
homepage: https://github.com/rushikeshsakharleofficial/ttrack-tracker
license: GPL-2.0

# Runtime dependencies. Binaries are static (no shared-lib deps); these cover
# tools used by the post-install script and optional integration.
depends:
  - e2fsprogs   # provides chattr/lsattr (key is locked immutable)
recommends:
  - bash-completion

contents:
  - src: ./bin/ttrack
    dst: /usr/bin/ttrack
    file_info:
      mode: 0755
  - src: ./bin/ttrackd
    dst: /usr/libexec/ttrackd
    file_info:
      mode: 0755
  - dst: /var/log/ttrack
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: root
  - src: ./scripts/systemd/ttrackd.service
    dst: /lib/systemd/system/ttrackd.service
    file_info:
      mode: 0644
  - src: ./internal/complete/ttrack.bash
    dst: /usr/share/bash-completion/completions/ttrack
    file_info:
      mode: 0644
  - src: ./man/ttrack.1
    dst: /usr/share/man/man1/ttrack.1
    file_info:
      mode: 0644
  - src: ./README.md
    dst: /usr/share/doc/ttrack/README.md
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/ttrack/LICENSE
    file_info:
      mode: 0644
  - src: ./scripts/profile.d/ttrack-autorec.sh
    dst: /etc/profile.d/ttrack-autorec.sh
    type: "config|noreplace"
    file_info:
      mode: 0644
  - src: ./scripts/ttrack-ssh-wrap.sh
    dst: /usr/libexec/ttrack-ssh-wrap
    file_info:
      mode: 0755
  - src: ./scripts/sshd-forcecommand.conf.example
    dst: /usr/share/doc/ttrack/sshd-forcecommand.conf.example
    file_info:
      mode: 0644
  - src: scripts/ansible/ttrack.py
    dst: /usr/share/ttrack/ansible/ttrack.py
    file_info:
      mode: 0644
  - src: scripts/ansible/README.md
    dst: /usr/share/ttrack/ansible/README.md
    file_info:
      mode: 0644
  - src: scripts/ttrack.conf.example
    dst: /usr/share/ttrack/ttrack.conf.example
    file_info:
      mode: 0644
  - src: scripts/ttrack.conf.example
    dst: /etc/ttrack/ttrack.conf
    type: config
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove:   ./packaging/preremove.sh
  postremove:  ./packaging/postremove.sh
