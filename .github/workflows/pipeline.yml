name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time — mirrors Jenkins disableConcurrentBuilds()
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

# Skip the redundant run triggered by the version-bump commit itself
jobs:
  pipeline:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: '0'

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # Stage: Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags needed for version calc
          token: ${{ secrets.GH_PAT }}   # allows pushing back the version bump

      # ─────────────────────────────────────────────────────────────────────
      # Go toolchain
      # ─────────────────────────────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Release Version  (main branch only)
      # Computes next version, updates Makefile / man page / README,
      # commits [ci skip] and pushes, exports RELEASE_VERSION for later steps.
      # ─────────────────────────────────────────────────────────────────────
      - name: Release Version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          # Resolve version: use tag on HEAD, else auto-bump patch.
          tag=$(git tag --points-at HEAD --list 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V | tail -1)
          if [ -n "$tag" ]; then
              VERSION="${tag#v}"
          else
              latest=$(git tag --list 'v*' \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -V | tail -1)
              latest="${latest:-v0.0.0}"
              v="${latest#v}"
              major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
              VERSION="${major}.${minor}.$((patch + 1))"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release version: v${VERSION}"

          TODAY="$(date +%Y-%m-%d)"
          sed -i "s/^VERSION ?= .*/VERSION ?= ${VERSION}/" Makefile
          sed -i "s/\.TH TTRACK 1 \"[^\"]*\" \"ttrack [0-9.]*\"/.TH TTRACK 1 \"${TODAY}\" \"ttrack ${VERSION}\"/" man/ttrack.1
          sed -i \
              -e "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*|releases/download/v${VERSION}|g" \
              -e "s|ttrack_[0-9]*\.[0-9]*\.[0-9]*|ttrack_${VERSION}|g" \
              -e "s|ttrack-[0-9]*\.[0-9]*\.[0-9]*|ttrack-${VERSION}|g" \
              README.md

          if git diff --quiet -- Makefile man/ttrack.1 README.md; then
              echo "Versioned files already match v${VERSION}"
          else
              git config user.name  "ttrack CI"
              git config user.email "noreply@ttrack.invalid"
              git add Makefile man/ttrack.1 README.md
              git commit -m "chore: set release version v${VERSION} [ci skip]"
              git push origin HEAD:main
          fi

      # Export version for non-main builds (PR): read from Makefile
      - name: Read Version (PR)
        if: github.ref != 'refs/heads/main'
        run: |
          VERSION=$(grep -E '^VERSION \?=' Makefile | head -1 | sed 's/VERSION ?= //')
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release version: v${VERSION} (from Makefile, PR build)"

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Format
      # ─────────────────────────────────────────────────────────────────────
      - name: Format
        run: |
          unformatted=$(find . -name "*.go" \
              -not -path "./.gopath/*" \
              -not -path "./.gocache/*" \
              -not -path "./vendor/*" \
              | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
              echo "Not gofmt-clean:"
              echo "$unformatted"
              exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Vet
      # ─────────────────────────────────────────────────────────────────────
      - name: Vet
        run: go vet ./...

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Test
      # ─────────────────────────────────────────────────────────────────────
      - name: Test
        run: go test ./... -v -count=1 2>&1 | tee test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Build
      # ─────────────────────────────────────────────────────────────────────
      - name: Build
        run: |
          mkdir -p build bin
          go build -ldflags "-X main.Version=${RELEASE_VERSION}" -o build/ttrack  ./cmd/ttrack/
          go build -o build/ttrackd ./cmd/ttrackd/
          cp build/ttrack  bin/ttrack
          cp build/ttrackd bin/ttrackd

      - name: Upload binaries
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            build/ttrack
            build/ttrackd

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Package
      # ─────────────────────────────────────────────────────────────────────
      - name: Package
        run: |
          mkdir -p release
          rm -f release/*.rpm release/*.deb release/ttrack-*-linux-amd64 release/SHA256SUMS
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          NFPM="$(go env GOPATH)/bin/nfpm"
          TTRACK_VERSION="${RELEASE_VERSION}" "$NFPM" pkg --config nfpm.yaml --packager rpm --target release/
          TTRACK_VERSION="${RELEASE_VERSION}" "$NFPM" pkg --config nfpm.yaml --packager deb --target release/
          cp build/ttrack "release/ttrack-${RELEASE_VERSION}-linux-amd64"
          (cd release && sha256sum * > SHA256SUMS)

      - name: Upload packages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: release/*

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Publish GitHub Release  (main branch only)
      # ─────────────────────────────────────────────────────────────────────
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION="${RELEASE_VERSION}"
          REPO="${GH_REPO}"
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release v${VERSION} already exists — uploading assets"
          else
              gh release create "v${VERSION}" \
                  --repo "$REPO" \
                  --target "$(git rev-parse HEAD)" \
                  --title "v${VERSION}" \
                  --notes "ttrack ${VERSION}"
          fi
          gh release upload "v${VERSION}" \
              release/*.rpm release/*.deb \
              "release/ttrack-${VERSION}-linux-amd64" \
              release/SHA256SUMS \
              --repo "$REPO" --clobber

      # ─────────────────────────────────────────────────────────────────────
      # Stage: SonarQube  (main branch only)
      # ─────────────────────────────────────────────────────────────────────
      - name: Coverage for SonarQube
        if: github.ref == 'refs/heads/main'
        run: go test ./... -coverprofile=coverage.out 2>/dev/null || true

      - name: SonarQube
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ttrack
            -Dsonar.projectName=ttrack
            -Dsonar.sources=.
            -Dsonar.exclusions=build/**,bin/**,vendor/**,*.pb.go,.gopath/**,.gocache/**
            -Dsonar.go.coverage.reportPaths=coverage.out

      # ─────────────────────────────────────────────────────────────────────
      # Stage: Deploy to Jump Server  (main branch only)
      # ─────────────────────────────────────────────────────────────────────
      - name: Setup SSH
        if: github.ref == 'refs/heads/main'
        env:
          JUMP_SERVER_KEY: ${{ secrets.JUMP_SERVER_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$JUMP_SERVER_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 89.167.44.42 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Jump Server
        if: github.ref == 'refs/heads/main'
        run: |
          DEB=$(ls release/*.deb | head -1)
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
              "$DEB" rushikesh.sakharle@89.167.44.42:/tmp/ttrack-latest.deb

          # Write deploy script to a file and scp it — avoids stdin pipe
          # which breaks when SSH_ORIGINAL_COMMAND goes through ttrack-ssh-wrap
          # ForceCommand (ttrack rec allocates a PTY, killing stdin piping).
          printf '%s\n' \
            'DEB=/tmp/ttrack-latest.deb' \
            'NEW_VER=$(dpkg-deb -f "$DEB" Version)' \
            'CUR_VER=$(dpkg -s ttrack 2>/dev/null | sed -n "s/^Version: //p")' \
            'if [ -z "$CUR_VER" ]; then' \
            '    echo "installing ttrack $NEW_VER (fresh)"' \
            '    sudo dpkg -i "$DEB" && echo installed' \
            'elif [ "$CUR_VER" = "$NEW_VER" ]; then' \
            '    echo "ttrack $CUR_VER already up to date -- skipping"' \
            'else' \
            '    echo "updating ttrack $CUR_VER -> $NEW_VER"' \
            '    sudo dpkg -i "$DEB" && echo updated' \
            'fi' > /tmp/ttrack-deploy.sh

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
              /tmp/ttrack-deploy.sh rushikesh.sakharle@89.167.44.42:/tmp/ttrack-deploy.sh

          ssh -T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o BatchMode=yes \
              rushikesh.sakharle@89.167.44.42 'bash /tmp/ttrack-deploy.sh'
