name: Auto Release

# On every push to main: bump the patch version from the latest tag and publish
# an rpm + deb GitHub Release. The tag is created with GITHUB_TOKEN, which does
# not retrigger the manual-tag release workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Compute next version
        id: ver
        run: |
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="0.2.1"
          else
            v="${latest#v}"
            major="${v%%.*}"
            rest="${v#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            patch="${patch%%[!0-9]*}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next}"

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ttrack ./cmd/ttrack
          CGO_ENABLED=0 go build -trimpath -o bin/ttrackd ./cmd/ttrackd

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build packages
        env:
          TTRACK_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release
          NFPM="$(go env GOPATH)/bin/nfpm"
          "$NFPM" pkg --config nfpm.yaml --packager rpm --target release/
          "$NFPM" pkg --config nfpm.yaml --packager deb --target release/
          cp bin/ttrack "release/ttrack-${TTRACK_VERSION}-linux-amd64"

      - name: Generate checksums
        run: cd release && sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            release/*.rpm
            release/*.deb
            release/ttrack-*-linux-amd64
            release/SHA256SUMS
          generate_release_notes: true
