name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build (static)
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ttrack ./cmd/ttrack
          CGO_ENABLED=0 go build -trimpath -o bin/ttrackd ./cmd/ttrackd

      - name: Smoke test binary
        run: ./bin/ttrack --help

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ttrack ./cmd/ttrack
          CGO_ENABLED=0 go build -trimpath -o bin/ttrackd ./cmd/ttrackd

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build rpm + deb
        env:
          TTRACK_VERSION: 0.0.${{ github.run_number }}
        run: |
          mkdir -p release
          NFPM="$(go env GOPATH)/bin/nfpm"
          "$NFPM" pkg --config nfpm.yaml --packager rpm --target release/
          "$NFPM" pkg --config nfpm.yaml --packager deb --target release/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ttrack-packages
          path: release/*
          if-no-files-found: error
