name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (static)
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ttrack ./cmd/ttrack
          CGO_ENABLED=0 go build -trimpath -o bin/ttrackd ./cmd/ttrackd

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build packages
        env:
          TTRACK_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release
          NFPM="$(go env GOPATH)/bin/nfpm"
          "$NFPM" pkg --config nfpm.yaml --packager rpm --target release/
          "$NFPM" pkg --config nfpm.yaml --packager deb --target release/
          cp bin/ttrack "release/ttrack-${TTRACK_VERSION}-linux-amd64"

      - name: Generate checksums
        run: cd release && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.rpm
            release/*.deb
            release/ttrack-*-linux-amd64
            release/SHA256SUMS
          generate_release_notes: true
